name: App
run-name: Build ${{ github.repository }}-${{ github.run_number }}

on:
  push:
    branches:
      - main
      - master

  pull_request:
    branches:
      - main
      - master

  workflow_dispatch:

env:
  JAVA_VERSION: "17"

jobs:

  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      - name: Grant Execute Permission
        run: chmod +x mvnw

      - name: Compile Application
        run: ./mvnw clean compile

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      - name: Grant Execute Permission
        run: chmod +x mvnw

      - name: Run Tests
        run: ./mvnw test

      - name: SonarQube Scan
        run: |
          ./mvnw sonar:sonar \
            -Dsonar.projectKey=$(./mvnw help:evaluate -Dexpression=project.artifactId -q -DforceStdout)
        env:
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  package:
    name: Package
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      - name: Grant Execute Permission
        run: chmod +x mvnw

      - name: Extract Maven Project Info
        run: |
          echo "ARTIFACT_ID=$(./mvnw help:evaluate -Dexpression=project.artifactId -q -DforceStdout)" >> $GITHUB_ENV
          echo "VERSION=$(./mvnw help:evaluate -Dexpression=project.version -q -DforceStdout)" >> $GITHUB_ENV

      - name: Package Application
        run: ./mvnw package -DskipTests

      - name: Archive JAR
        run: |
          mkdir -p artifacts
          cp target/*.jar artifacts/

      - name: Upload JAR Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_ID }}-${{ env.VERSION }}
          path: artifacts/*.jar

      - name: Build Docker Image
        run: |
          docker build \
            -t ${{ env.ARTIFACT_ID }}:${{ env.VERSION }} \
            -t ${{ env.ARTIFACT_ID }}:latest .

      - name: Success Notification
        if: success()
        run: echo "Build Successful"

      - name: Failure Notification
        if: failure()
        run: echo "Build Failed"
